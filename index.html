<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Таксі Миронівка</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <!-- Картографічна бібліотека Leaflet (як в Uklon/Bolt) -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, sans-serif; }
        body, html { height: 100%; width: 100%; overflow: hidden; background: #121212; color: #fff; }

        /* Карта на половину екрана */
        #map { width: 100%; height: 48vh; }

        /* Панель під картою */
        .panel {
            height: 52vh;
            background: #1e1e1e;
            padding: 14px;
            border-top-left-radius: 20px;
            border-top-right-radius: 20px;
            box-shadow: 0 -4px 15px rgba(0,0,0,0.5);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            position: relative;
            z-index: 1000;
        }

        .input-group { margin-bottom: 8px; }
        .input-group label { font-size: 11px; color: #aaa; font-weight: bold; text-transform: uppercase; }

        .input-box {
            display: flex;
            align-items: center;
            background: #2a2a2a;
            border: 2px solid #333;
            border-radius: 10px;
            padding: 8px 12px;
            margin-top: 3px;
        }

        .input-box.active { border-color: #ffcc00; }

        .input-box input {
            background: transparent;
            border: none;
            color: #fff;
            width: 100%;
            font-size: 14px;
            outline: none;
        }

        .dot { width: 12px; height: 12px; border-radius: 50%; margin-right: 10px; flex-shrink: 0; }
        .dot-a { background: #28a745; }
        .dot-b { background: #dc3545; }

        .gps-btn {
            background: #2a2a2a; border: 1px solid #444; color: #ffcc00;
            padding: 4px 10px; border-radius: 6px; font-size: 11px; cursor: pointer; font-weight: bold;
        }

        .price-card {
            background: #2a2a2a;
            border: 1px solid #ffcc00;
            border-radius: 12px;
            padding: 8px;
            text-align: center;
        }

        .price-val { font-size: 22px; font-weight: bold; color: #ffcc00; }
        .price-sub { font-size: 11px; color: #aaa; }

        .btn-order {
            background: #ffcc00; color: #000; font-size: 16px; font-weight: bold;
            padding: 14px; border: none; border-radius: 12px; width: 100%; cursor: pointer;
        }

        .comment-input {
            width: 100%; background: #2a2a2a; border: 1px solid #333; color: #fff;
            padding: 8px 12px; border-radius: 8px; outline: none; font-size: 13px; margin-top: 4px;
        }
    </style>
</head>
<body>

    <div id="map"></div>

    <div class="panel">
        <div>
            <!-- ТОЧКА А -->
            <div class="input-group">
                <div style="display:flex; justify-content:space-between; align-items:center;">
                    <label>1. Звідки (Точка А)</label>
                    <button class="gps-btn" onclick="useGPS()">📍 Моє GPS</button>
                </div>
                <div class="input-box active" id="boxA" onclick="setActivePoint('A')">
                    <div class="dot dot-a"></div>
                    <input type="text" id="inputA" placeholder="Клацніть на карті або введіть" onchange="addressChanged('A')">
                </div>
            </div>

            <!-- ТОЧКА Б -->
            <div class="input-group">
                <label>2. Куди (Точка Б)</label>
                <div class="input-box" id="boxB" onclick="setActivePoint('B')">
                    <div class="dot dot-b"></div>
                    <input type="text" id="inputB" placeholder="Клацніть на карті або введіть" onchange="addressChanged('B')">
                </div>
            </div>

            <!-- КОМЕНТАР -->
            <input type="text" id="comment" class="comment-input" placeholder="Коментар водію (під'їзд, багаж)">
        </div>

        <!-- КАРТКА ЦІНИ -->
        <div class="price-card">
            <div class="price-val" id="priceDisplay">60 грн</div>
            <div class="price-sub" id="detailsDisplay">Поставте мітки для точного розрахунку</div>
        </div>

        <button class="btn-order" onclick="sendOrder()">Замовити таксі</button>
    </div>

    <script>
        let tg = window.Telegram.WebApp;
        tg.expand();

        // Центр Миронівки
        const defaultLat = 49.6581;
        const defaultLng = 30.9926;

        let map = L.map('map', { zoomControl: false }).setView([defaultLat, defaultLng], 14);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19 }).addTo(map);

        let markerA = null;
        let markerB = null;
        let routePolyline = null;
        let activePoint = 'A';

        let price = 60;
        let distanceStr = "По місту";
        let rate = 40;

        // Іконки міток
        const iconA = L.icon({
            iconUrl: 'https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-2x-green.png',
            shadowUrl: 'https://cdnjs.cloudflare.com/ajax/libs/leaflet/0.7.7/images/marker-shadow.png',
            iconSize: [25, 41], iconAnchor: [12, 41], popupAnchor: [1, -34], shadowSize: [41, 41]
        });

        const iconB = L.icon({
            iconUrl: 'https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-2x-red.png',
            shadowUrl: 'https://cdnjs.cloudflare.com/ajax/libs/leaflet/0.7.7/images/marker-shadow.png',
            iconSize: [25, 41], iconAnchor: [12, 41], popupAnchor: [1, -34], shadowSize: [41, 41]
        });

        function setActivePoint(pt) {
            activePoint = pt;
            if(pt === 'A') {
                document.getElementById('boxA').classList.add('active');
                document.getElementById('boxB').classList.remove('active');
            } else {
                document.getElementById('boxB').classList.add('active');
                document.getElementById('boxA').classList.remove('active');
            }
        }

        // Клік по карті переставляє активну мітку
        map.on('click', function(e) {
            setPoint(activePoint, e.latlng.lat, e.latlng.lng, true);
        });

        async function setPoint(type, lat, lng, reverseGeocode = true) {
            if(type === 'A') {
                if(markerA) map.removeLayer(markerA);
                markerA = L.marker([lat, lng], {icon: iconA, draggable: true}).addTo(map);
                markerA.on('dragend', function(e) {
                    setPoint('A', e.target.getLatLng().lat, e.target.getLatLng().lng, true);
                });
                if(reverseGeocode) {
                    let addr = await reverseGeo(lat, lng);
                    document.getElementById('inputA').value = addr;
                }
                if(!markerB) setActivePoint('B');
            } else {
                if(markerB) map.removeLayer(markerB);
                markerB = L.marker([lat, lng], {icon: iconB, draggable: true}).addTo(map);
                markerB.on('dragend', function(e) {
                    setPoint('B', e.target.getLatLng().lat, e.target.getLatLng().lng, true);
                });
                if(reverseGeocode) {
                    let addr = await reverseGeo(lat, lng);
                    document.getElementById('inputB').value = addr;
                }
            }
            calculateRoute();
        }

        // Пошук назви вулиці за координатами
        async function reverseGeo(lat, lng) {
            try {
                let res = await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lng}`);
                let data = await res.json();
                if(data && data.address) {
                    let road = data.address.road || data.address.pedestrian || data.address.suburb || data.address.village || "";
                    let house = data.address.house_number || "";
                    if(road) return `${road} ${house}`.trim();
                }
            } catch(e){}
            return `${lat.toFixed(4)}, ${lng.toFixed(4)}`;
        }

        // Введення адреси текстом
        async function addressChanged(type) {
            let text = type === 'A' ? document.getElementById('inputA').value : document.getElementById('inputB').value;
            if(!text) return;
            let search = text.toLowerCase().includes('миронівк') ? text : `Миронівка, ${text}`;
            try {
                let res = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(search)}`);
                let data = await res.json();
                if(data && data.length > 0) {
                    let lat = parseFloat(data[0].lat);
                    let lng = parseFloat(data[0].lon);
                    setPoint(type, lat, lng, false);
                    map.panTo([lat, lng]);
                }
            } catch(e){}
        }

        // Побудова лінії маршруту та розрахунок ціни
        async function calculateRoute() {
            if(!markerA || !markerB) {
                document.getElementById('priceDisplay').innerText = "60 грн";
                document.getElementById('detailsDisplay').innerText = "Поставте обидві мітки на карті";
                return;
            }

            let posA = markerA.getLatLng();
            let posB = markerB.getLatLng();

            try {
                let res = await fetch(`https://router.project-osrm.org/route/v1/driving/${posA.lng},${posA.lat};${posB.lng},${posB.lat}?overview=full&geometries=geojson`);
                let data = await res.json();
                if(data.routes && data.routes.length > 0) {
                    let route = data.routes[0];
                    let distKm = (route.distance / 1000).toFixed(1);

                    // Малювання жовтої лінії
                    if(routePolyline) map.removeLayer(routePolyline);
                    let coords = route.geometry.coordinates.map(c => [c[1], c[0]]);
                    routePolyline = L.polyline(coords, {color: '#ffcc00', weight: 5, opacity: 0.9}).addTo(map);
                    map.fitBounds(routePolyline.getBounds(), {padding: [30, 30]});

                    let textB = document.getElementById('inputB').value.toLowerCase();
                    let isOutside = textB.includes('с.') || textB.includes('село') || distKm > 7;
                    rate = isOutside ? 60 : 40;
                    price = Math.max(60, Math.round(distKm * rate));
                    distanceStr = `${distKm} км`;

                    document.getElementById('priceDisplay').innerText = `${price} грн`;
                    document.getElementById('detailsDisplay').innerText = `Відстань: ${distKm} км (${rate} грн/км)`;
                    return;
                }
            } catch(e){}

            document.getElementById('priceDisplay').innerText = "60 грн";
        }

        function useGPS() {
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition((pos) => {
                    let lat = pos.coords.latitude;
                    let lng = pos.coords.longitude;
                    map.setView([lat, lng], 16);
                    setPoint('A', lat, lng, true);
                }, () => alert("Увімкніть GPS у налаштуваннях телефону"));
            }
        }

        function sendOrder() {
            let addrA = document.getElementById('inputA').value.trim() || "Обрано на карті";
            let addrB = document.getElementById('inputB').value.trim() || "Обрано на карті";
            let comment = document.getElementById('comment').value.trim() || "Немає";

            let posA = markerA ? markerA.getLatLng() : null;
            let posB = markerB ? markerB.getLatLng() : null;

            let payload = {
                pointA: addrA,
                pointB: addrB,
                price: price,
                distance: distanceStr,
                rate: rate,
                comment: comment,
                coordsA: posA ? { lat: posA.lat, lng: posA.lng } : null,
                coordsB: posB ? { lat: posB.lat, lng: posB.lng } : null
            };

            try {
                tg.sendData(JSON.stringify(payload));
                tg.close();
            } catch(e) {
                alert("Будь ласка, відкривайте форму через кнопку «🚕 Замовити таксі» внизу чату.");
            }
        }
    </script>
</body>
</html>
