<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Таксі Миронівка</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --accent-color: #ffcc00;
            --text-color: #ffffff;
            --text-muted: #aaaaaa;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 16px;
            box-sizing: border-box;
        }

        .header { text-align: center; margin-bottom: 20px; }
        .header h2 { margin: 0; color: var(--accent-color); font-size: 22px; }
        .header p { margin: 5px 0 0 0; color: var(--text-muted); font-size: 13px; }

        .card {
            background-color: var(--card-bg);
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 16px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }

        label {
            display: block;
            font-size: 13px;
            color: var(--text-muted);
            margin-bottom: 6px;
            font-weight: 600;
        }

        input {
            width: 100%;
            padding: 12px;
            background-color: #2a2a2a;
            border: 1px solid #333;
            border-radius: 8px;
            color: #fff;
            font-size: 15px;
            box-sizing: border-box;
            margin-bottom: 10px;
        }

        input:focus { outline: none; border-color: var(--accent-color); }

        .btn-gps {
            width: 100%;
            padding: 10px;
            background-color: #2a2a2a;
            border: 1px dashed var(--accent-color);
            color: var(--accent-color);
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            margin-bottom: 12px;
        }

        .quick-locations {
            display: flex;
            gap: 6px;
            overflow-x: auto;
            padding-bottom: 8px;
            margin-bottom: 10px;
        }

        .tag {
            background-color: #333;
            color: #ccc;
            padding: 6px 10px;
            border-radius: 16px;
            font-size: 12px;
            white-space: nowrap;
            cursor: pointer;
        }

        .price-box {
            background-color: #2a2a2a;
            border: 1px solid var(--accent-color);
            border-radius: 10px;
            padding: 14px;
            text-align: center;
            margin-top: 10px;
        }

        .price-value {
            font-size: 24px;
            font-weight: bold;
            color: var(--accent-color);
            margin: 4px 0;
        }

        .price-details { font-size: 12px; color: #ccc; }

        .btn-submit {
            width: 100%;
            padding: 15px;
            background-color: var(--accent-color);
            color: #000;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div class="header">
        <h2>🚖 Таксі Миронівка</h2>
        <p>Замовлення таксі по місту та району</p>
    </div>

    <div class="card">
        <!-- ТОЧКА А -->
        <label>ЗВІДКИ (Точка А):</label>
        <button type="button" class="btn-gps" onclick="getGPS()">
            📍 Натисніть для точної геолокації (GPS)
        </button>
        
        <div class="quick-locations">
            <span class="tag" onclick="setPointA('Вокзал')">🚆 Вокзал</span>
            <span class="tag" onclick="setPointA('Лікарня')">🏥 Лікарня</span>
            <span class="tag" onclick="setPointA('Центр')">🏛 Центр</span>
            <span class="tag" onclick="setPointA('Ринок')">🛒 Ринок</span>
        </div>

        <input type="text" id="pointA" placeholder="Введіть вулицю (наприклад: Корсунська 6)" oninput="autoCalculate()">

        <!-- ТОЧКА Б -->
        <label>КУДИ (Точка Б):</label>
        <div class="quick-locations">
            <span class="tag" onclick="setPointB('Лікарня')">🏥 Лікарня</span>
            <span class="tag" onclick="setPointB('с. Владиславка')">🏡 с. Владиславка</span>
            <span class="tag" onclick="setPointB('с. Карапиші')">🏡 с. Карапиші</span>
            <span class="tag" onclick="setPointB('с. Росава')">🏡 с. Росава</span>
            <span class="tag" onclick="setPointB('с. Яхни')">🏡 с. Яхни</span>
        </div>

        <input type="text" id="pointB" placeholder="Введіть куди (наприклад: с. Владиславка)" oninput="autoCalculate()">

        <input type="text" id="comment" placeholder="Коментар водію (під'їзд, багаж тощо)">

        <!-- РАСЧЕТ ЦЕНЫ -->
        <div class="price-box">
            <div style="font-size: 12px; color: #aaa;">ОРИЄНТОВНА ВАРТІСТЬ:</div>
            <div class="price-value" id="priceDisplay">60 грн</div>
            <div class="price-details" id="priceDetails">Стандартний міський тариф</div>
        </div>
    </div>

    <button type="button" class="btn-submit" onclick="sendOrder()">Замовити таксі</button>

    <script>
        let tg = window.Telegram.WebApp;
        tg.expand();

        let userCoordsA = null;
        let userCoordsB = null;
        let calculatedPrice = 60;
        let calculatedDistance = "По місту";
        let currentRate = 40;

        function getGPS() {
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(
                    (position) => {
                        userCoordsA = {
                            lat: position.coords.latitude,
                            lng: position.coords.longitude
                        };
                        document.getElementById('pointA').value = `📍 GPS (${userCoordsA.lat.toFixed(4)}, ${userCoordsA.lng.toFixed(4)})`;
                        autoCalculate();
                    },
                    () => alert("Увімкніть геопозицію у налаштуваннях телефону.")
                );
            }
        }

        function setPointA(val) {
            document.getElementById('pointA').value = val;
            autoCalculate();
        }

        function setPointB(val) {
            document.getElementById('pointB').value = val;
            autoCalculate();
        }

        async function geocode(address) {
            let search = address.toLowerCase().includes('миронівк') ? address : `Миронівка, ${address}`;
            try {
                let res = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(search)}`);
                let data = await res.json();
                if (data && data.length > 0) {
                    return { lat: parseFloat(data[0].lat), lng: parseFloat(data[0].lon) };
                }
            } catch (e) {}
            return null;
        }

        async function autoCalculate() {
            const pointA = document.getElementById('pointA').value.trim();
            const pointB = document.getElementById('pointB').value.trim();

            if (!pointA || !pointB) {
                document.getElementById('priceDisplay').innerText = "60 грн";
                document.getElementById('priceDetails').innerText = "Заповніть пункти Звідки та Куди";
                calculatedPrice = 60;
                return;
            }

            const isOutside = pointB.toLowerCase().includes('с.') || pointB.toLowerCase().includes('село');
            currentRate = isOutside ? 60 : 40;

            let coordA = userCoordsA || await geocode(pointA);
            let coordB = await geocode(pointB);

            if (coordA && coordB) {
                userCoordsA = coordA;
                userCoordsB = coordB;
                try {
                    let routeRes = await fetch(`https://router.project-osrm.org/route/v1/driving/${coordA.lng},${coordA.lat};${coordB.lng},${coordB.lat}?overview=false`);
                    let routeData = await routeRes.json();
                    if (routeData.routes && routeData.routes.length > 0) {
                        let distKm = (routeData.routes[0].distance / 1000).toFixed(1);
                        calculatedDistance = `${distKm} км`;
                        calculatedPrice = Math.max(60, Math.round(distKm * currentRate));
                        
                        document.getElementById('priceDisplay').innerText = `${calculatedPrice} грн`;
                        document.getElementById('priceDetails').innerText = `Відстань: ${distKm} км | Тариф: ${currentRate} грн/км`;
                        return;
                    }
                } catch (e) {}
            }

            // Фоллбек, если карта не определила точные координаты улицы
            calculatedPrice = isOutside ? 150 : 60;
            calculatedDistance = isOutside ? "За місто" : "По місту";
            document.getElementById('priceDisplay').innerText = `${calculatedPrice} грн`;
            document.getElementById('priceDetails').innerText = isOutside ? "Тариф за місто (базовий)" : "Фіксований міський тариф";
        }

        function sendOrder() {
            const pointA = document.getElementById('pointA').value.trim();
            const pointB = document.getElementById('pointB').value.trim();
            const comment = document.getElementById('comment').value.trim();

            if (!pointA || !pointB) {
                alert("Будь ласка, вкажіть звідки та куди!");
                return;
            }

            const payload = {
                pointA: pointA,
                pointB: pointB,
                price: calculatedPrice,
                distance: calculatedDistance,
                rate: currentRate,
                comment: comment || "Немає",
                coordsA: userCoordsA,
                coordsB: userCoordsB
            };

            tg.sendData(JSON.stringify(payload));
        }
    </script>
</body>
</html>
