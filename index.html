<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Таксі Миронівка</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    
    <!-- Leaflet CSS & JS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body, html { height: 100%; width: 100%; overflow: hidden; background: #121212; color: #fff; position: relative; }

        /* Контейнер карти на весь екран */
        #map-container { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; }
        #map { width: 100%; height: 100%; background: #e5e3df; }

        /* Кнопка GPS */
        .map-gps-btn {
            position: absolute;
            top: 15px;
            right: 15px;
            z-index: 1000;
            background: #ffffff;
            border: 2px solid #28a745;
            color: #28a745;
            width: 46px;
            height: 46px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            box-shadow: 0 4px 14px rgba(0,0,0,0.3);
            cursor: pointer;
        }
        .map-gps-btn:active { transform: scale(0.92); }

        /* Панель керування (Шторка) */
        .panel {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            z-index: 1001;
            background: #1e1e1e;
            padding: 10px 14px 16px 14px;
            border-top-left-radius: 22px;
            border-top-right-radius: 22px;
            box-shadow: 0 -8px 25px rgba(0,0,0,0.7);
            transition: transform 0.35s cubic-bezier(0.4, 0, 0.2, 1);
            max-height: 80vh;
            display: flex;
            flex-direction: column;
        }

        /* Згорнутий стан шторки */
        .panel.collapsed {
            transform: translateY(calc(100% - 62px));
        }

        /* Плашка-ручка для згортання */
        .panel-handle-area {
            width: 100%;
            padding: 6px 0 10px 0;
            display: flex;
            justify-content: center;
            cursor: pointer;
        }
        .panel-handle {
            width: 42px;
            height: 5px;
            background: #555;
            border-radius: 3px;
        }

        /* Шорткати */
        .shortcuts {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding-bottom: 6px;
            margin-bottom: 6px;
            scrollbar-width: none;
        }
        .shortcuts::-webkit-scrollbar { display: none; }
        .chip {
            background: #2a2a2a;
            border: 1px solid #3c3c3c;
            color: #ddd;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 12px;
            white-space: nowrap;
            cursor: pointer;
        }
        .chip:active { background: #ffcc00; color: #000; font-weight: bold; }

        /* Поля введення */
        .input-group { margin-bottom: 6px; position: relative; }
        .input-group label { font-size: 10px; color: #aaa; font-weight: bold; text-transform: uppercase; }

        .input-box {
            display: flex;
            align-items: center;
            background: #282828;
            border: 1.5px solid #383838;
            border-radius: 10px;
            padding: 8px 10px;
            margin-top: 2px;
        }
        .input-box.active { border-color: #ffcc00; background: #2e2e2e; }

        .input-box input {
            background: transparent;
            border: none;
            color: #fff;
            width: 100%;
            font-size: 13.5px;
            outline: none;
        }

        .dot { width: 10px; height: 10px; border-radius: 50%; margin-right: 8px; flex-shrink: 0; }
        .dot-a { background: #28a745; box-shadow: 0 0 6px rgba(40, 167, 69, 0.8); }
        .dot-b { background: #dc3545; box-shadow: 0 0 6px rgba(220, 53, 69, 0.8); }

        /* Підказки */
        .suggestions {
            position: absolute;
            top: 100%; left: 0; right: 0;
            background: #282828;
            border: 1px solid #ffcc00;
            border-radius: 8px;
            max-height: 140px;
            overflow-y: auto;
            z-index: 2500;
            box-shadow: 0 6px 16px rgba(0,0,0,0.8);
            display: none;
        }
        .suggestion-item {
            padding: 9px 11px;
            font-size: 12.5px;
            border-bottom: 1px solid #353535;
            cursor: pointer;
            color: #eee;
        }
        .suggestion-item:active { background: #383838; color: #ffcc00; }

        /* Картка ціни */
        .price-card {
            background: #252525;
            border: 1px solid #ffcc00;
            border-radius: 12px;
            padding: 8px 12px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-top: 4px;
            margin-bottom: 8px;
        }
        .price-main { font-size: 22px; font-weight: 800; color: #ffcc00; }
        .price-info { text-align: right; }
        .info-dist { font-size: 12.5px; font-weight: bold; color: #fff; }
        .info-time { font-size: 11px; color: #aaa; }

        .comment-input {
            width: 100%; background: #282828; border: 1px solid #383838; color: #fff;
            padding: 8px 10px; border-radius: 8px; outline: none; font-size: 12.5px; margin-top: 4px; margin-bottom: 6px;
        }

        .btn-order {
            background: #ffcc00; color: #000; font-size: 15px; font-weight: 700;
            padding: 12px; border: none; border-radius: 10px; width: 100%; cursor: pointer;
            box-shadow: 0 4px 12px rgba(255, 204, 0, 0.3);
        }
        .btn-order:active { background: #e6b800; }
    </style>
</head>
<body>

    <div id="map-container">
        <div id="map"></div>
        <button class="map-gps-btn" onclick="useGPS()" title="Моя геопозиція">🎯</button>
    </div>

    <div class="panel" id="mainPanel" onclick="onPanelClick(event)">
        <!-- Ручка згортання -->
        <div class="panel-handle-area" onclick="togglePanel(event)">
            <div class="panel-handle"></div>
        </div>

        <div id="panelContent">
            <!-- Шорткати -->
            <div class="shortcuts">
                <div class="chip" onclick="selectShortcut('Залізничний вокзал, Миронівка')">🚆 Вокзал</div>
                <div class="chip" onclick="selectShortcut('Лікарня, Миронівка')">🏥 Лікарня</div>
                <div class="chip" onclick="selectShortcut('Центр, Миронівка')">🏛 Центр</div>
                <div class="chip" onclick="selectShortcut('с. Владиславка')">🏡 Владиславка</div>
                <div class="chip" onclick="selectShortcut('с. Карапиші')">🏡 Карапиші</div>
                <div class="chip" onclick="selectShortcut('с. Росава')">🏡 Росава</div>
            </div>

            <!-- ТОЧКА А -->
            <div class="input-group">
                <label>1. Звідки (Точка А)</label>
                <div class="input-box active" id="boxA" onclick="setActivePoint('A')">
                    <div class="dot dot-a"></div>
                    <input type="text" id="inputA" placeholder="Введіть адресу або оберіть на карті" oninput="onTyping('A')" onchange="onManualInputChange('A')" onkeydown="if(event.key==='Enter') hideKeyboard()" autocomplete="off">
                </div>
                <div id="sugA" class="suggestions"></div>
            </div>

            <!-- ТОЧКА Б -->
            <div class="input-group">
                <label>2. Куди (Точка Б)</label>
                <div class="input-box" id="boxB" onclick="setActivePoint('B')">
                    <div class="dot dot-b"></div>
                    <input type="text" id="inputB" placeholder="Введіть адресу або оберіть на карті" oninput="onTyping('B')" onchange="onManualInputChange('B')" onkeydown="if(event.key==='Enter') hideKeyboard()" autocomplete="off">
                </div>
                <div id="sugB" class="suggestions"></div>
            </div>

            <input type="text" id="comment" class="comment-input" placeholder="Коментар водію (під'їзд, дитяче крісло тощо)" onkeydown="if(event.key==='Enter') hideKeyboard()">

            <div class="price-card">
                <div class="price-main" id="priceDisplay">60 грн</div>
                <div class="price-info">
                    <div class="info-dist" id="distDisplay">По місту / району</div>
                    <div class="info-time" id="timeDisplay">Вкажіть адреси</div>
                </div>
            </div>

            <button class="btn-order" onclick="sendOrder()">Замовити таксі</button>
        </div>
    </div>

    <script>
        let tg = window.Telegram.WebApp;
        tg.expand();

        const defaultLat = 49.6581;
        const defaultLng = 30.9926;

        let map = L.map('map', { 
            zoomControl: false,
            tap: false 
        }).setView([defaultLat, defaultLng], 14);

        // КАРТА GOOGLE MAPS (Стандартна кольорова карта Google)
        L.tileLayer('https://{s}.google.com/vt/lyrs=m&x={x}&y={y}&z={z}', {
            maxZoom: 20,
            subdomains: ['mt0', 'mt1', 'mt2', 'mt3'],
            attribution: '&copy; Google Maps'
        }).addTo(map);

        setTimeout(() => { map.invalidateSize(); }, 300);

        let markerA = null;
        let markerB = null;
        let gpsAccuracyCircle = null;
        let routePolyline = null;
        let activePoint = 'A';

        let price = 60;
        let distanceStr = "По місту";
        let durationStr = "~5 хв";
        let rate = 40;
        let typingTimer;

        const iconA = L.icon({
            iconUrl: 'https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-2x-green.png',
            shadowUrl: 'https://cdnjs.cloudflare.com/ajax/libs/leaflet/0.7.7/images/marker-shadow.png',
            iconSize: [25, 41], iconAnchor: [12, 41], popupAnchor: [1, -34], shadowSize: [41, 41]
        });

        const iconB = L.icon({
            iconUrl: 'https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-2x-red.png',
            shadowUrl: 'https://cdnjs.cloudflare.com/ajax/libs/leaflet/0.7.7/images/marker-shadow.png',
            iconSize: [25, 41], iconAnchor: [12, 41], popupAnchor: [1, -34], shadowSize: [41, 41]
        });

        // Управління згортанням шторки
        function collapsePanel() {
            document.getElementById('mainPanel').classList.add('collapsed');
        }

        function expandPanel() {
            document.getElementById('mainPanel').classList.remove('collapsed');
        }

        function togglePanel(e) {
            if(e) e.stopPropagation();
            let p = document.getElementById('mainPanel');
            if(p.classList.contains('collapsed')) expandPanel();
            else collapsePanel();
        }

        function onPanelClick(e) {
            let p = document.getElementById('mainPanel');
            if(p.classList.contains('collapsed')) {
                expandPanel();
            }
        }

        // Автозгортання при русі по карті
        map.on('dragstart', collapsePanel);
        map.on('zoomstart', collapsePanel);

        map.on('click', function(e) {
            hideKeyboard();
            setPoint(activePoint, e.latlng.lat, e.latlng.lng, true);
            expandPanel(); // Розгортаємо назад після вибору точки
        });

        function hideKeyboard() {
            if (document.activeElement && typeof document.activeElement.blur === 'function') {
                document.activeElement.blur();
            }
        }

        async function fetchWithTimeout(resource, options = {}) {
            const { timeout = 3000 } = options;
            const controller = new AbortController();
            const id = setTimeout(() => controller.abort(), timeout);
            try {
                const response = await fetch(resource, { ...options, signal: controller.signal });
                clearTimeout(id);
                return response;
            } catch (error) {
                clearTimeout(id);
                throw error;
            }
        }

        function getHaversineDistance(lat1, lon1, lat2, lon2) {
            const R = 6371;
            const dLat = (lat2 - lat1) * Math.PI / 180;
            const dLon = (lon2 - lon1) * Math.PI / 180;
            const a = Math.sin(dLat/2) * Math.sin(dLat/2) +
                      Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
                      Math.sin(dLon/2) * Math.sin(dLon/2);
            const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
            return (R * c * 1.35).toFixed(1);
        }

        function setActivePoint(pt) {
            activePoint = pt;
            if(pt === 'A') {
                document.getElementById('boxA').classList.add('active');
                document.getElementById('boxB').classList.remove('active');
            } else {
                document.getElementById('boxB').classList.add('active');
                document.getElementById('boxA').classList.remove('active');
            }
        }

        async function setPoint(type, lat, lng, reverseGeocode = true) {
            if(type === 'A') {
                if(markerA) map.removeLayer(markerA);
                markerA = L.marker([lat, lng], {icon: iconA, draggable: true}).addTo(map);
                markerA.on('dragend', function(e) {
                    setPoint('A', e.target.getLatLng().lat, e.target.getLatLng().lng, true);
                });
                if(reverseGeocode) {
                    let addr = await reverseGeo(lat, lng);
                    document.getElementById('inputA').value = addr;
                }
                if(!markerB) setActivePoint('B');
            } else {
                if(markerB) map.removeLayer(markerB);
                markerB = L.marker([lat, lng], {icon: iconB, draggable: true}).addTo(map);
                markerB.on('dragend', function(e) {
                    setPoint('B', e.target.getLatLng().lat, e.target.getLatLng().lng, true);
                });
                if(reverseGeocode) {
                    let addr = await reverseGeo(lat, lng);
                    document.getElementById('inputB').value = addr;
                }
            }
            hideSuggestions();
            calculateRoute();
        }

        async function reverseGeo(lat, lng) {
            try {
                let res = await fetchWithTimeout(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lng}&accept-language=uk`, { timeout: 2500 });
                let data = await res.json();
                if(data && data.address) {
                    let village = data.address.village || data.address.town || data.address.city || "";
                    let road = data.address.road || data.address.pedestrian || "";
                    let house = data.address.house_number || "";
                    
                    let parts = [];
                    if(village && village !== "Миронівка") parts.push(`с. ${village}`);
                    if(road) parts.push(house ? `${road}, ${house}` : road);
                    if(parts.length > 0) return parts.join(', ');
                }
            } catch(e){}
            return `Точка (${lat.toFixed(4)}, ${lng.toFixed(4)})`;
        }

        // Обробка ручного введення тексту (якщо клієнт просто друкує адресу)
        async function onManualInputChange(type) {
            let val = type === 'A' ? document.getElementById('inputA').value.trim() : document.getElementById('inputB').value.trim();
            if(val.length < 2) return;

            let searchQuery = val.toLowerCase().includes('обл') ? val : `${val}, Київська область`;
            try {
                let res = await fetchWithTimeout(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(searchQuery)}&accept-language=uk&limit=1`, { timeout: 2500 });
                let data = await res.json();
                if(data && data.length > 0) {
                    let lat = parseFloat(data[0].lat);
                    let lng = parseFloat(data[0].lon);
                    setPoint(type, lat, lng, false);
                }
            } catch(e){}
        }

        function onTyping(type) {
            clearTimeout(typingTimer);
            typingTimer = setTimeout(() => {
                let val = type === 'A' ? document.getElementById('inputA').value.trim() : document.getElementById('inputB').value.trim();
                if(val.length < 2) return hideSuggestions();
                fetchSuggestions(type, val);
            }, 300);
        }

        async function fetchSuggestions(type, query) {
            let searchQuery = query.toLowerCase().includes('обл') ? query : `${query}, Київська область`;
            try {
                let viewbox = '30.60,49.82,31.30,49.48';
                let res = await fetchWithTimeout(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(searchQuery)}&viewbox=${viewbox}&accept-language=uk&limit=5`, { timeout: 2500 });
                let data = await res.json();
                let sugBox = document.getElementById(type === 'A' ? 'sugA' : 'sugB');
                sugBox.innerHTML = '';

                if(data && data.length > 0) {
                    sugBox.style.display = 'block';
                    data.forEach(item => {
                        let div = document.createElement('div');
                        div.className = 'suggestion-item';
                        let cleanName = item.display_name.split(',').slice(0, 3).join(',').trim();
                        div.innerText = cleanName;
                        div.onclick = (e) => {
                            e.stopPropagation();
                            hideKeyboard();
                            let lat = parseFloat(item.lat);
                            let lng = parseFloat(item.lon);
                            if(type === 'A') document.getElementById('inputA').value = cleanName;
                            else document.getElementById('inputB').value = cleanName;
                            setPoint(type, lat, lng, false);
                            map.flyTo([lat, lng], 15);
                            hideSuggestions();
                        };
                        sugBox.appendChild(div);
                    });
                } else {
                    hideSuggestions();
                }
            } catch(e){
                hideSuggestions();
            }
        }

        function hideSuggestions() {
            document.getElementById('sugA').style.display = 'none';
            document.getElementById('sugB').style.display = 'none';
        }

        async function calculateRoute() {
            if(!markerA || !markerB) {
                document.getElementById('priceDisplay').innerText = "60 грн";
                document.getElementById('distDisplay').innerText = "По місту / району";
                document.getElementById('timeDisplay').innerText = "Оберіть 2 точки";
                return;
            }

            let posA = markerA.getLatLng();
            let posB = markerB.getLatLng();
            let distKm = 0;
            let durationMin = 0;
            let routeSuccess = false;

            try {
                let res = await fetchWithTimeout(`https://router.project-osrm.org/route/v1/driving/${posA.lng},${posA.lat};${posB.lng},${posB.lat}?overview=full&geometries=geojson`, { timeout: 3000 });
                let data = await res.json();
                if(data.routes && data.routes.length > 0) {
                    let route = data.routes[0];
                    distKm = (route.distance / 1000).toFixed(1);
                    durationMin = Math.max(3, Math.round(route.duration / 60));

                    if(routePolyline) map.removeLayer(routePolyline);
                    let coords = route.geometry.coordinates.map(c => [c[1], c[0]]);
                    routePolyline = L.polyline(coords, {color: '#4285F4', weight: 6, opacity: 0.9, lineCap: 'round'}).addTo(map);
                    map.fitBounds(routePolyline.getBounds(), {padding: [50, 50]});
                    routeSuccess = true;
                }
            } catch(e){}

            if (!routeSuccess) {
                distKm = getHaversineDistance(posA.lat, posA.lng, posB.lat, posB.lng);
                durationMin = Math.max(4, Math.round(distKm * 2));

                if(routePolyline) map.removeLayer(routePolyline);
                routePolyline = L.polyline([[posA.lat, posA.lng], [posB.lat, posB.lng]], {color: '#4285F4', weight: 4, dashArray: '8, 8', opacity: 0.8}).addTo(map);
                map.fitBounds(routePolyline.getBounds(), {padding: [50, 50]});
            }

            let textA = document.getElementById('inputA').value.toLowerCase();
            let textB = document.getElementById('inputB').value.toLowerCase();
            let isOutside = textA.includes('с.') || textB.includes('с.') || textA.includes('село') || textB.includes('село') || distKm > 6;
            
            rate = isOutside ? 60 : 40;
            price = Math.max(60, Math.round(distKm * rate));
            distanceStr = `${distKm} км`;
            durationStr = `~${durationMin} хв у дорозі`;

            document.getElementById('priceDisplay').innerText = `${price} грн`;
            document.getElementById('distDisplay').innerText = `${distKm} км (${rate} грн/км)`;
            document.getElementById('timeDisplay').innerText = durationStr;
        }

        async function selectShortcut(placeName) {
            hideKeyboard();
            let type = activePoint;
            let searchQuery = placeName.includes('Миронівка') ? placeName : `${placeName}, Київська область`;
            try {
                let res = await fetchWithTimeout(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(searchQuery)}&accept-language=uk`, { timeout: 2500 });
                let data = await res.json();
                if(data && data.length > 0) {
                    let lat = parseFloat(data[0].lat);
                    let lng = parseFloat(data[0].lon);
                    if(type === 'A') document.getElementById('inputA').value = placeName;
                    else document.getElementById('inputB').value = placeName;
                    setPoint(type, lat, lng, false);
                    map.flyTo([lat, lng], 15);
                }
            } catch(e){}
        }

        function useGPS() {
            hideKeyboard();
            if (!navigator.geolocation) {
                alert("Пристрій не підтримує геолокацію");
                return;
            }

            navigator.geolocation.getCurrentPosition(
                async (pos) => {
                    let lat = pos.coords.latitude;
                    let lng = pos.coords.longitude;
                    let accuracy = pos.coords.accuracy;

                    if (gpsAccuracyCircle) map.removeLayer(gpsAccuracyCircle);
                    gpsAccuracyCircle = L.circle([lat, lng], {
                        radius: accuracy,
                        color: '#4285F4',
                        fillColor: '#4285F4',
                        fillOpacity: 0.15,
                        weight: 1
                    }).addTo(map);

                    map.flyTo([lat, lng], 16, { animate: true, duration: 1 });
                    await setPoint('A', lat, lng, true);
                },
                (err) => {
                    alert("Не вдалося отримати GPS. Перевірте, чи увімкнено геопозицію в телефоні.");
                },
                { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 }
            );
        }

        function sendOrder() {
            hideKeyboard();
            let addrA = document.getElementById('inputA').value.trim() || "Обрано на карті";
            let addrB = document.getElementById('inputB').value.trim() || "Обрано на карті";
            let comment = document.getElementById('comment').value.trim() || "Немає";

            let posA = markerA ? markerA.getLatLng() : null;
            let posB = markerB ? markerB.getLatLng() : null;

            let payload = {
                pointA: addrA,
                pointB: addrB,
                price: price,
                distance: distanceStr,
                time: durationStr,
                rate: rate,
                comment: comment,
                coordsA: posA ? { lat: posA.lat, lng: posA.lng } : null,
                coordsB: posB ? { lat: posB.lat, lng: posB.lng } : null
            };

            try {
                tg.sendData(JSON.stringify(payload));
                tg.close();
            } catch(e) {
                alert("Будь ласка, відкривайте форму через кнопку у боті Telegram.");
            }
        }
    </script>
</body>
</html>
